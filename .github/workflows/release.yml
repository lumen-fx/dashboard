name: release

# A pushed tag publishes the template as a release with a tarball asset, so
# a fixed URL always serves the latest tagged tree. A tag is named for the
# Lumen release its tree is for (v0.0.6 for Lumen 0.0.6), and the tag for a
# Lumen version that has not shipped yet may be re-cut until it does.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack the template
        run: |
          mkdir -p out
          tar --exclude='./.git' --exclude='./.github' --exclude='./out' \
              -czf "out/template.tar.gz" .
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" out/template.tar.gz --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" out/template.tar.gz \
              --title "${GITHUB_REF_NAME}" --notes ""
          fi
